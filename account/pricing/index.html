<!doctype html>
<html lang="en"><head>
  <link rel="manifest" href="/manifest.json"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans — DateVault</title><link rel="stylesheet" href="../../css/style.css"><style>
.pricing-page{padding:0 1rem 2rem}.billing-toggle{display:flex;justify-content:center;gap:.5rem;margin:1rem 0}.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.plan-card{position:relative}.plan-card.recommended{border:1px solid var(--gold)}.plan-card h2{margin:0}.feature{display:flex;gap:.5rem;align-items:flex-start;font-size:13px;margin:.55rem 0}.feature i{width:17px;height:17px;border-radius:50%;flex:0 0 17px;background:var(--gold);display:grid;place-items:center}.feature.off{color:var(--muted)}.feature.off i{background:var(--surface2)}.feature svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}.feature.off svg{stroke:var(--muted)}.price{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:2.3rem;margin:.5rem 0}.addon-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}@media(max-width:700px){.plan-grid,.addon-grid{grid-template-columns:1fr}}
</style></head><body><div class="page-loader" id="loader"><div class="loader-logo">DateVault</div></div><div class="app-shell"><header class="topbar"><div class="topbar-title">Membership plans</div><a class="btn btn-outline btn-sm" href="/app/profile/">Back to profile</a></header><main class="pricing-page"><div class="billing-toggle"><button id="monthly" class="btn btn-gold btn-sm" type="button">Monthly</button><button id="annual" class="btn btn-outline btn-sm" type="button">Annual <span class="status-badge status-gold">Best Value</span></button></div><p class="muted" style="text-align:center">Annual billing saves up to $120.</p><section id="plans" class="plan-grid"></section><h2 style="margin:2rem 0 .75rem">Add-ons</h2><section id="addons" class="addon-grid"></section></main></div><div id="toast" class="toast"></div><script type="module">
import { requireMember, db } from '../../js/auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { SUBSCRIPTION_PLANS, getSubscription } from '../../js/subscription.js';
let billing='monthly',profile={},prices={};
const check='<svg viewBox="0 0 16 16"><path d="M3 8l3 3 7-7"/></svg>', off='<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
function feature(text,included=true){return `<div class="feature ${included?'':'off'}"><i>${included?check:off}</i><span>${text}</span></div>`}
function money(v){return `$${Number(v||0).toFixed(2)}`}
function planPrice(plan){return Number(prices?.[plan]?.[billing] ?? SUBSCRIPTION_PLANS[plan][billing])}
function render(){const current=getSubscription(profile).plan; const plans=[['standard','Standard','0 after entry',['5 likes per day','Chat with matches','Verified members only'],['See who liked you','Explore all members','Super likes — purchase required','Read receipts']],['elite','Elite','', ['Unlimited likes','Chat with matches','See who liked you','Explore all members','Super likes — purchase required','Read receipts','Hide location and age'],['Priority in discover','Vault badge']],['vault','Vault','', ['Everything in Elite','Unlimited super likes (included)','Priority placement in discover','Vault badge on profile','Priority support'],[]]]; document.querySelector('#plans').innerHTML=plans.map(([key,label,sub,yes,no])=>`<article class="glass-card plan-card ${key==='elite'?'recommended':''}">${key==='elite'?'<span class="status-badge status-gold">Recommended</span>':''}<h2>${label}</h2><div class="price">${key==='standard'?'$0':money(planPrice(key))}${key==='standard'?'':billing==='annual'?'/yr':'/mo'}</div>${sub?`<p class="muted">${sub}</p>`:''}<div>${yes.map(x=>feature(x)).join('')}${no.map(x=>feature(x,false)).join('')}</div>${key==='standard'?`<p class="muted">${current==='standard'?'Your current plan':'Included after entry'}</p>`:`<div class="stack" style="margin-top:1rem"><a class="btn btn-gold btn-full" href="/account/payment/?purpose=subscription&plan=${key}&billing=${billing}">${billing==='annual'?'Annual':'Monthly'} plan</a><a class="btn btn-outline btn-full" href="/account/payment/?purpose=subscription&plan=${key}&billing=${billing==='annual'?'monthly':'annual'}">${billing==='annual'?'Monthly':'Annual'} <span class="status-badge status-gold">Best Value</span></a></div>`}</article>`).join(''); const defaults={boost:{usd:2.99,tokens:299,label:'Profile Boost',detail:'24-hour top placement'},superlikePack:{usd:4.99,tokens:499,label:'Super Like Pack',detail:'10 super likes'},incognito:{usd:3.99,tokens:399,label:'Incognito Mode',detail:'7 days'}}; const config=prices.addons||{}; document.querySelector('#addons').innerHTML=Object.entries(defaults).map(([key,item])=>{const value=config[key]||item;const addon=key==='superlikePack'?'superlike_pack':key;return `<article class="glass-card"><strong>${item.label}</strong><p class="muted">${item.detail}</p><p style="color:var(--gold)">${money(value.usd)} or ${value.tokens} tokens</p><a class="btn btn-outline btn-full" href="/account/payment/?purpose=addon&addon=${addon}&amount=${value.usd}">Buy with USD</a></article>`}).join('')}
for(const id of ['monthly','annual'])document.getElementById(id).onclick=()=>{billing=id;document.getElementById('monthly').className=`btn btn-sm ${billing==='monthly'?'btn-gold':'btn-outline'}`;document.getElementById('annual').className=`btn btn-sm ${billing==='annual'?'btn-gold':'btn-outline'}`;render()};
(async()=>{const session=await requireMember();profile=session.profile||{};const snap=await getDoc(doc(db,'config','pricing'));prices=snap.exists()?snap.data():{};render();document.getElementById('loader').classList.add('hidden')})().catch(e=>{document.getElementById('loader').classList.add('hidden');document.getElementById('toast').textContent=e.message;document.getElementById('toast').classList.add('show')});
</script></body></html>
