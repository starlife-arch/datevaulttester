<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — DateVault</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../../favicon.png"/>
  <link rel="stylesheet" href="../../css/style.css"/>
</head>
<body>
  <div class="page-loader" id="loader"><div class="loader-logo">DateVault</div></div>
  <div class="auth-shell">
    <div class="auth-card fade-up">
      <a href="/" style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:1.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back
      </a>
      <div class="auth-logo">DateVault</div>
      <p class="auth-tagline">Welcome back</p>
      <div id="errorMsg" style="display:none;background:rgba(224,92,110,0.1);border:1px solid rgba(224,92,110,0.3);color:var(--danger);padding:0.75rem 1rem;border-radius:12px;font-size:13px;margin-bottom:1rem;"></div>
      <button type="button" class="btn btn-outline btn-full google-signin" id="googleBtn" onclick="doGoogleSignIn()"><span aria-hidden="true" style="font-weight:700">G</span> Continue with Google</button><div class="auth-divider"><span>or</span></div><div class="field-group" id="loginForm">
        <div>
          <label>Email Address</label>
          <input type="email" id="email" placeholder="your@email.com"/>
        </div>
        <div>
          <label>Password</label>
          <div style="position:relative;">
            <input type="password" id="password" placeholder="Your password" style="padding-right:3rem;"/>
            <button type="button" aria-label="Show password" onclick="togglePassword('password', this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gold);cursor:pointer;font-size:16px;"></button>
          </div>
        </div>
        <button type="button" onclick="doForgotPassword()" style="align-self:flex-end;background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;padding:0;">Forgot password?</button>
        <button class="btn btn-gold btn-full" id="loginBtn" onclick="doLogin()">Sign In</button>
      </div>
      <div id="otpContainer" style="display:none;"></div>
      <p class="auth-footer" id="authFooter">Don't have an account? <a href="/auth/signup/">Apply for membership</a></p>
    </div>
  </div>

  <script type="module">
    import { login, resetPassword, auth, onAuthStateChanged, routeUser, signInWithGoogle, handleGoogleRedirectResult } from "../../js/auth.js?v=google-redirect-1";
    import { createOtpVerification } from "../../js/otp.js";

    let authInProgress = true;

    async function initializeAuth() {
      try {
        const result = await handleGoogleRedirectResult();
        if (result) {
          if (result.isNew) window.location.href = '/auth/google-phone/';
          else await routeUser(result.user);
          return;
        }
      } catch (error) {
        console.error('Google redirect sign-in failed', error);
        showErr(error.message || 'Could not continue with Google.');
      }
      authInProgress = false;
      onAuthStateChanged(auth, user => {
        if (user && !authInProgress) routeUser(user);
        else if (!user) document.getElementById('loader').classList.add('hidden');
      });
    }

    initializeAuth();

    window.doGoogleSignIn = async function() {
      authInProgress = true;
      const button=document.getElementById('googleBtn'); button.disabled=true; button.textContent='Connecting to Google...';
      try { const result=await signInWithGoogle(); if(!result) return; if(result.isNew) window.location.href='/auth/google-phone/'; else await routeUser(result.user); }
      catch(error) { authInProgress = false; console.error('Google sign-in failed', error); if(error.code==='auth/account-exists-with-different-credential') { const {showAlert}=await import('../../js/dialog.js'); await showAlert('An account already exists with this email. Sign in with your password instead.',{title:'Use your password',icon:'info'}); } else { showErr(error.message || 'Could not continue with Google.'); } button.disabled=false; button.innerHTML='<span aria-hidden="true" style="font-weight:700">G</span> Continue with Google'; }
    };

    window.togglePassword = function(inputId, btn) {
      const input = document.getElementById(inputId);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '' : '';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    };

    window.doForgotPassword = async function() {
      const email = document.getElementById('email').value.trim();
      if (!email) { showErr('Enter your email address first, then click Forgot password.'); return; }
      document.getElementById('errorMsg').style.display = 'none';
      showPasswordResetOtp(email);
    };

    function showPasswordResetOtp(email) {
      const loginForm = document.getElementById('loginForm');
      const otpContainer = document.getElementById('otpContainer');
      loginForm.style.display = 'none';
      document.getElementById('authFooter').style.display = 'none';
      otpContainer.style.display = 'block';

      const otp = createOtpVerification({
        container: otpContainer,
        email,
        purpose: 'password_reset',
        onBack: () => {
          otp.destroy();
          otpContainer.style.display = 'none';
          loginForm.style.display = 'flex';
          document.getElementById('authFooter').style.display = 'block';
        },
        onVerified: async () => {
          try {
            await resetPassword(email);
            otp.destroy();
            otpContainer.style.display = 'none';
            loginForm.style.display = 'flex';
            document.getElementById('authFooter').style.display = 'block';
            showSuccess('A password reset link has been sent to your email.');
          } catch(e) {
            let msg = 'Could not send reset email. Please check the email address.';
            if (e.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
            if (e.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
            otpContainer.style.display = 'none';
            loginForm.style.display = 'flex';
            document.getElementById('authFooter').style.display = 'block';
            showErr(msg);
          }
        }
      });
      otp.start();
    }

    window.doLogin = async function() {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';

      if (!email || !pw) { showErr('Please fill in all fields.'); return; }
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const user = await login(email, pw);
        await routeUser(user);
      } catch(e) {
        let msg = 'Invalid email or password.';
        if (e.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
        showErr(msg);
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    };

    function showErr(msg) {
      const err = document.getElementById('errorMsg');
      err.style.color = 'var(--danger)';
      err.style.borderColor = 'rgba(224,92,110,0.3)';
      err.style.background = 'rgba(224,92,110,0.1)';
      err.textContent = msg; err.style.display = 'block';
    }

    function showSuccess(msg) {
      const err = document.getElementById('errorMsg');
      err.style.color = 'var(--success)';
      err.style.borderColor = 'rgba(76,175,125,0.3)';
      err.style.background = 'rgba(76,175,125,0.1)';
      err.textContent = msg; err.style.display = 'block';
    }
  </script>
</body>
</html>
