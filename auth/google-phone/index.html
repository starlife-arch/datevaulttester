<!doctype html><html lang="en"><head>
  <link rel="manifest" href="/manifest.json"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone number — DateVault</title><link rel="stylesheet" href="../../css/style.css"></head><body><div class="auth-shell"><main class="auth-card fade-up"><div class="auth-logo">DateVault</div><p class="auth-tagline">One last detail</p><p class="muted">Add your phone number to finish setting up your account.</p><div id="errorMsg" class="gift-error" role="alert"></div><label for="phone">Phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="+254 700 000 000" autocomplete="tel"><p class="muted" style="font-size:12px">Include country code.</p><button id="savePhone" class="btn btn-gold btn-full">Continue</button></main></div><script type="module">import {auth,db,onAuthStateChanged,routeUser} from '../../js/auth.js';import{doc,getDoc,updateDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';let user;onAuthStateChanged(auth,async current=>{if(!current){location.href='/auth/login/';return}user=current;const profile=await getDoc(doc(db,'users',user.uid));if(profile.exists()&&profile.data().phone){routeUser(user)}});document.getElementById('savePhone').onclick=async()=>{const phone=document.getElementById('phone').value.trim().replace(/\s/g,'');const error=document.getElementById('errorMsg');if(!/^\+\d+$/.test(phone)){error.textContent='Enter a phone number with country code, for example +254 700 000 000.';return}const button=document.getElementById('savePhone');button.disabled=true;try{await updateDoc(doc(db,'users',user.uid),{phone});await routeUser(user)}catch(e){console.error('Could not save Google signup phone',e);error.textContent=e.message||'Could not save your phone number.';button.disabled=false}}</script></body></html>
