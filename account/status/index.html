<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Application Status — DateVault</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../../favicon.png"/>
  <link rel="stylesheet" href="../../css/style.css"/>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card fade-up" id="statusCard">
      <div class="auth-logo">DateVault</div>
      <p class="auth-tagline">Checking status…</p>
    </div>
  </div>
  <script type="module">
    import { auth, db } from '../../js/firebase.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    onAuthStateChanged(auth, async user => {
      if (!user) { location.href = '/auth/login/'; return; }
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists()) { location.href = '/auth/signup/'; return; }
      const data = snap.data();
      if (data.status !== 'rejected') { location.href = '/app/dashboard/'; return; }

      document.getElementById('statusCard').innerHTML = `
        <div class="auth-logo">DateVault</div>
        <div style="font-size:3rem;margin:1rem 0;"></div>
        <h2 style="color:var(--danger);">Application Not Approved</h2>
        <p class="auth-tagline">Your application was not approved at this time.</p>
        ${data.rejectionReason ? `<div style="margin:1.25rem 0;padding:1rem;background:rgba(224,92,110,0.1);border:1px solid rgba(224,92,110,0.25);border-radius:12px;color:var(--text);font-size:14px;line-height:1.6;">${data.rejectionReason}</div>` : ''}
        <button class="btn btn-outline btn-full" onclick="location.href='/auth/login/'">Return to Login</button>
      `;
    });
  </script>
</body>
</html>
