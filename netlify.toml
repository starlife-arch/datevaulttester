[build]
  publish = "."

# Folder routes resolve naturally to each directory's index.html. Do not add an
# SPA catch-all, which would prevent direct page routes from loading.
# Redirect only the legacy root filenames.
[[redirects]]
  from = "/login.html"
  to = "/auth/login/"
  status = 301

[[redirects]]
  from = "/signup.html"
  to = "/auth/signup/"
  status = 301

[[redirects]]
  from = "/dashboard.html"
  to = "/app/dashboard/"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
