<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore — DateVault</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../../favicon.png"/>
  <link rel="stylesheet" href="../../css/style.css"/>
</head>
<body>
  <div class="page-loader" id="loader"><div class="loader-logo">DateVault</div></div>
  <div class="app-shell">
    <div class="topbar">
      <div class="topbar-title">Explore</div>
    </div>
    <div style="padding:0 1rem 1rem;">
      <div style="position:relative;margin-bottom:1rem;">
        <input type="text" id="searchInput" placeholder="Search by name or country..." oninput="filterProfiles()" style="padding-left:2.5rem;"/>
        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>
    <div class="profile-grid" id="exploreGrid"></div>
    <div id="emptyMsg" style="display:none;text-align:center;padding:2rem;color:var(--muted);">No members found.</div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/app/dashboard/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
      Discover
    </a>
    <a class="nav-item active" id="exploreNavItem" href="/app/explore/">
      <span id="exploreNavLock" style="display:none;position:absolute;top:2px;right:10px;color:var(--gold);font-size:12px;line-height:1;">◇</span>
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Explore
    </a>
    <a class="nav-item" href="/app/likes/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      Likes
    </a>
    <a class="nav-item" href="/app/wallet/"><span style="font-size:20px;line-height:22px;"></span>Wallet</a>
    <a class="nav-item" href="/app/chat/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Chat
      <span class="badge" id="chatBadge" style="display:none;"></span>
    </a>
    <a class="nav-item" href="/app/profile/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { requireActiveMember, db } from "../../js/auth.js";
    import { listenForNotifications } from "../../js/notifications.js";
    import { startCallListener } from "../../js/call-listener.js";
    import { hasPlan, isVault, vaultBadge } from "../../js/subscription.js";
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { haversineKm, formatDistance, getAdminSettings, resolveVisibility, requestAndSaveLocation } from "../../js/location.js";

    let allProfiles = [], myUser, myProfile, myCoords = null, adminSettings = {};

    async function init() {
      const { user, profile } = await requireActiveMember();
      myUser = user;
      myProfile = profile;
      listenForNotifications(myUser.uid, hasSomethingNew => { document.getElementById('chatBadge').style.display = hasSomethingNew ? 'block' : 'none'; });
      updateExploreNavLock();
      myCoords = profile._location || null;
      requestAndSaveLocation(user.uid).then(c => { if (c) myCoords = c; });
      adminSettings = await getAdminSettings();
      document.getElementById('loader').classList.add('hidden');
      if (isStandardPlan()) { renderStandardLocked(); return; }
      const snap = await getDocs(query(collection(db, 'users'), where('status','==','active_member'), where('banned','==',false)));
      allProfiles = snap.docs
        .filter(d => d.id !== myUser.uid)
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(profile => !isAddonActive(profile.addons?.incognito))
        .sort((a, b) => profileSortScore(b) - profileSortScore(a));
      renderGrid(allProfiles);
    }


    function isAddonActive(addon) {
      if (!addon?.active) return false;
      if (!addon.expiresAt) return true;
      const expiresAt = addon.expiresAt?.toDate?.() ? addon.expiresAt.toDate() : new Date(addon.expiresAt);
      return expiresAt > new Date();
    }

    // Sort boosted members first, then Vault, Elite, and Standard members.
    function profileSortScore(profile) {
      let score = 0;
      const boost = profile.addons?.boost;
      if (boost?.active) {
        const expiresAt = boost.expiresAt?.toDate?.() ? boost.expiresAt.toDate() : new Date(boost.expiresAt || 0);
        if (expiresAt > new Date()) score += 1000;
      }
      if (isVault(profile)) score += 100;
      else if (hasPlan(profile, 'elite')) score += 50;
      return score;
    }

    function isStandardPlan() {
      return (myProfile?.stage === 'paid' || myProfile?.hasPaid || myProfile?.paid) && (myProfile?.plan || myProfile?.subscription?.plan) === 'standard';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function updateExploreNavLock() {
      const nav = document.getElementById('exploreNavItem');
      const lock = document.getElementById('exploreNavLock');
      if (!nav || !lock || !isStandardPlan()) return;
      lock.style.display = 'block';
      nav.onclick = (event) => {
        event.preventDefault();
        showToast('Explore requires Elite or Vault. Upgrade to unlock.');
      };
    }

    function renderStandardLocked() {
      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('exploreGrid').innerHTML = `
        <div class="glass-card locked-state">
          <div class="lock-icon">◇</div>
          <p style="font-weight:700;color:var(--text);">Browse all verified members — not just your matches.</p>
          <p class="muted">Upgrade to Elite to unlock Explore</p>
          <button class="btn btn-gold btn-sm" onclick="location.href='/pricing.html'">View Plans</button>
        </div>`;
    }

    function renderGrid(list) {
      const grid = document.getElementById('exploreGrid');
      const empty = document.getElementById('emptyMsg');
      grid.innerHTML = '';
      if (list.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      list.forEach(p => {
        const photo = p.photos && p.photos[0] ? p.photos[0] : '';
        const age = p.dob ? Math.floor((Date.now() - new Date(p.dob)) / 31557600000) : '';
        const vis = resolveVisibility(p, myProfile, adminSettings);
        const ageDisplay = vis.showAge && age ? `, ${age}` : '';
        const locationDisplay = vis.showLocation ? `${p.city || ''}${p.city&&p.country?', ':''}${p.country||''}` : '';
        const distanceDisplay = vis.showDistance && myCoords && p._location ? ` · ${formatDistance(haversineKm(myCoords.lat, myCoords.lng, p._location.lat, p._location.lng))}` : '';
        const tile = document.createElement('div');
        tile.className = 'profile-tile';
        tile.style.cursor = 'pointer';
        tile.onclick = () => { window.location.href = `/app/member/?uid=${p.id}`; };
        tile.innerHTML = `
          ${photo ? `<img src="${photo}" alt="${p.displayName}" loading="lazy"/>` : `<div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem;"></div>`}
          <div class="tile-info">
            <div class="tile-name">${p.displayName || 'Member'}${ageDisplay} ${vaultBadge(p)}</div>
            <div class="tile-meta">${locationDisplay}${distanceDisplay}</div>
          </div>
        `;
        grid.appendChild(tile);
      });
    }

    window.filterProfiles = function() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = q ? allProfiles.filter(p =>
        (p.displayName||'').toLowerCase().includes(q) ||
        (p.country||'').toLowerCase().includes(q) ||
        (p.city||'').toLowerCase().includes(q)
      ) : allProfiles;
      renderGrid(filtered);
    };

    init().catch(error => { console.error('Page initialization failed', error); document.getElementById('loader')?.classList.add('hidden'); });
  </script>
</body>
</html>
